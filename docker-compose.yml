# Layanan: db (PostgreSQL) dan app (Go). Profil opsional: db_test dan frontend (E10).
# Nilai port dan rahasia dibaca dari .env (tidak di-commit; contoh ada di .env.example).
# COMPOSE_PROJECT_NAME diambil Compose langsung dari .env (tim 5-B: capstone-m5b).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?isi DB_USER di .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?isi DB_PASSWORD di .env}
      POSTGRES_DB: ${DB_NAME:?isi DB_NAME di .env}
      TZ: UTC
    ports:
      # DB_BIND kosong = hanya dapat diakses dari mesin itu sendiri
      - "${DB_BIND:-127.0.0.1}:${DB_PORT:-5510}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # Skrip *.sql berjalan berurutan hanya saat volume kosong (down -v lalu up = migrasi ulang)
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      args:
        # Samakan GO_VERSION dengan baris "go" di go.mod
        GO_VERSION: ${GO_VERSION:-1.24}
        MAIN_PKG: ${MAIN_PKG:-./cmd/server}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
      # Kata sandi dengan karakter khusus (@ : / ?) harus di-URL-encode pada DATABASE_URL
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?isi JWT_SECRET di .env}
      # Kata sandi semua akun seed; hanya dipakai oleh "docker compose run --rm app seed"
      SEED_PASSWORD: ${SEED_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3110}
      TZ: Asia/Jakarta
    ports:
      - "${APP_PORT:-8110}:8080"
    healthcheck:
      # GET /healthz memeriksa proses dan koneksi database (BASE-09)
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Database terpisah untuk go test (tidak ikut jalan secara bawaan):
  #   docker compose --profile db_test up -d db_test
  db_test:
    profiles: ["db_test"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:?isi DB_USER di .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?isi DB_PASSWORD di .env}
      POSTGRES_DB: ${DB_NAME:?isi DB_NAME di .env}_test
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-5610}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Menyajikan hasil build frontend (folder ./frontend/dist) pada FE_PORT:
  #   npm run build            (di folder frontend)
  #   docker compose --profile frontend up -d frontend
  # Konfigurasi nginx bawaan tanpa fallback ke index.html, jadi frontend memakai createHashRouter.
  frontend:
    profiles: ["frontend"]
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${FE_PORT:-3110}:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro

volumes:
  db_data: