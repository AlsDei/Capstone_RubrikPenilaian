openapi: 3.0.3
info:
  title: Penilaian Multi-Penilai dan Rubrik (Tim 5-B, MyIF Capstone Modul 5)
  version: 0.3.0
  description: Kontrak API Tim 5-B (Modul 5 Penilaian Multi-Penilai dan Rubrik). Format error mengikuti Kamus Data Bersama
    bagian 4; masukan pengguna yang salah tidak boleh menghasilkan 500. x-peran = peran yang boleh memanggil endpoint.
servers:
- url: http://localhost:8110
  description: Lokal (APP_PORT tim 5-B, E10)
security:
- bearerAuth: []
tags:
- name: Sistem
- name: Auth
- name: Rubrik
- name: Komponen
- name: Penugasan
- name: Penilaian
- name: Hasil
- name: Mahasiswa
- name: Rekap
- name: Audit
paths:
  /healthz:
    get:
      tags:
      - Sistem
      summary: Pemeriksaan kesehatan (proses hidup dan koneksi database)
      x-peran:
      - publik
      security: []
      responses:
        '200':
          description: Sehat
        '503':
          description: Database tidak terjangkau
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: Login dengan identitas dan kata sandi
      x-peran:
      - publik
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Berhasil. Berisi token JWT, peran, dan identitas pengguna.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          description: KREDENSIAL_SALAH (pesan sama untuk identitas tidak ada dan kata sandi salah)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/Validasi422'
        '429':
          $ref: '#/components/responses/TooMany429'
  /api/v1/auth/ganti-password:
    post:
      tags:
      - Auth
      summary: Mengganti password (wajib setelah login pertama)
      description: >
        Hanya bisa dipanggil bila harus_ganti_password = true.
        Setelah berhasil, harus_ganti_password menjadi false dan
        token baru diterbitkan.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GantiPasswordRequest'
      responses:
        '200':
          description: Password berhasil diganti. Berisi token baru.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Tidak401'
        '409':
          description: >
            TIDAK_PERLU_GANTI (harus_ganti_password sudah false,
            endpoint ini tidak perlu dipanggil lagi)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/Validasi422'
  /api/v1/rubrik:
    post:
      tags:
      - Rubrik
      summary: Membuat rubrik beserta kriteria
      x-peran:
      - koordinator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RubrikInput'
      responses:
        '201':
          description: Rubrik dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rubrik'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Tidak401'
        '403':
          $ref: '#/components/responses/Dilarang403'
        '409':
          description: KODE_SUDAH_ADA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/Validasi422'
    get:
      tags:
      - Rubrik
      summary: Daftar rubrik
      x-peran:
      - koordinator
      responses:
        '200':
          description: Daftar rubrik
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RubrikList'
        '401':
          $ref: '#/components/responses/Tidak401'
        '403':
          $ref: '#/components/responses/Dilarang403'
      parameters:
      - $ref: '#/components/parameters/Halaman'
      - $ref: '#/components/parameters/PerHalaman'
  /api/v1/rubrik/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      tags:
      - Rubrik
      summary: Detail satu rubrik
      x-peran:
      - koordinator
      responses:
        '200':
          description: Detail rubrik
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rubrik'
        '401':
          $ref: '#/components/responses/Tidak401'
        '403':
          $ref: '#/components/responses/Dilarang403'
        '404':
          $ref: '#/components/responses/TidakAda404'
    put:
      tags:
      - Rubrik
      summary: Mengubah rubrik yang belum terkunci
      x-peran:
      - koordinator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RubrikInput'
      responses:
        '200':
          description: Rubrik diubah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rubrik'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Tidak401'
        '403':
          $ref: '#/components/responses/Dilarang403'
        '404':
          $ref: '#/components/responses/TidakAda404'
        '409':
          description: RUBRIK_TERKUNCI (rubrik sudah dipakai menilai)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/Validasi422'
  /api/v1/rubrik/{id}/versi:
    parameters:
    - $ref: '#/components/parameters/Id'
    post:
      tags:
      - Rubrik
      summary: Membuat versi baru dari rubrik
      x-peran:
      - koordinator
      responses:
        '201':
          description: Versi baru dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rubrik'
        '401':
          $ref: '#/components/responses/Tidak401'
        '403':
          $ref: '#/components/responses/Dilarang403'
        '404':
          $ref: '#/components/responses/TidakAda404'
  /api/v1/komponen:
    get:
      tags:
      - Komponen
      summary: Daftar komponen dan bobotnya
      x-peran:
      - koordinator
      responses:
        '200':
          description: Daftar komponen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KomponenList'
        '401':
          $ref: '#/components/responses/Tidak401'
        '403':
          $ref: '#/components/responses/Dilarang403'
    put:
      tags:
      - Komponen
      summary: Mengganti seluruh daftar komponen dan bobot (atomik)
      x-peran:
      - koordinator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KomponenInput'
      responses:
        '200':
          description: Daftar komponen diganti; berisi seluruh daftar baru
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KomponenList'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Tidak401'
        '403':
          $ref: '#/components/responses/Dilarang403'
        '404':
          $ref: '#/components/responses/TidakAda404'
        '409':
          description: KOMPONEN_TERPAKAI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/Validasi422'
  /api/v1/penugasan:
    get:
      tags:
      - Penugasan
      summary: Daftar penugasan
      x-peran:
      - koordinator
      responses:
        '200':
          description: Daftar penugasan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PenugasanList'
        '401':
          $ref: '#/components/responses/Tidak401'
        '403':
          $ref: '#/components/responses/Dilarang403'
      parameters:
      - name: kode_kelompok
        in: query
        required: false
        schema:
          type: string
      - name: komponen
        in: query
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/Halaman'
      - $ref: '#/components/parameters/PerHalaman'
    post:
      tags:
      - Penugasan
      summary: Menugaskan penilai ke kelompok × komponen (maksimal 4 penilai)
      x-peran:
      - koordinator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PenugasanInput'
      responses:
        '201':
          description: Penugasan dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Penugasan'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Tidak401'
        '403':
          $ref: '#/components/responses/Dilarang403'
        '404':
          $ref: '#/components/responses/TidakAda404'
        '409':
          description: PENILAI_MAKSIMAL, PENUGASAN_DUPLIKAT, atau NILAI_TERKUNCI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/Validasi422'
  /api/v1/penugasan/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    delete:
      tags:
      - Penugasan
      summary: Mencabut penugasan
      x-peran:
      - koordinator
      responses:
        '204':
          description: Penugasan dicabut
        '401':
          $ref: '#/components/responses/Tidak401'
        '403':
          $ref: '#/components/responses/Dilarang403'
        '404':
          $ref: '#/components/responses/TidakAda404'
        '409':
          description: PENUGASAN_SUDAH_DINILAI atau NILAI_TERKUNCI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/penilai/tugas:
    get:
      tags:
      - Penilaian
      summary: Daftar tugas milik penilai yang login
      x-peran:
      - dosen
      - mitra
      responses:
        '200':
          description: Daftar tugas penilai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TugasList'
        '401':
          $ref: '#/components/responses/Tidak401'
        '403':
          $ref: '#/components/responses/Dilarang403'
      parameters:
      - $ref: '#/components/parameters/Halaman'
      - $ref: '#/components/parameters/PerHalaman'
  /api/v1/penugasan/{id}/penilaian:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      tags:
      - Penilaian
      summary: Melihat penilaian pada satu penugasan
      description: Dosen dan mitra hanya untuk penugasan miliknya sendiri; koordinator boleh melihat.
      x-peran:
      - dosen
      - mitra
      - koordinator
      responses:
        '200':
          description: Penilaian pada penugasan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Penilaian'
        '401':
          $ref: '#/components/responses/Tidak401'
        '403':
          $ref: '#/components/responses/Dilarang403'
        '404':
          $ref: '#/components/responses/TidakAda404'
    put:
      tags:
      - Penilaian
      summary: Menyimpan draf atau mengubah skor
      x-peran:
      - dosen
      - mitra
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PenilaianInput'
      responses:
        '200':
          description: Draf tersimpan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Penilaian'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Tidak401'
        '403':
          $ref: '#/components/responses/Dilarang403'
        '404':
          $ref: '#/components/responses/TidakAda404'
        '409':
          description: NILAI_TERKUNCI (komponen sudah final)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/Validasi422'
  /api/v1/penugasan/{id}/penilaian/kirim:
    parameters:
    - $ref: '#/components/parameters/Id'
    post:
      tags:
      - Penilaian
      summary: Mengirim penilaian (hitung ulang nilai gabungan dan penanda kalibrasi)
      description: Body opsional. Bila skor disertakan, skor disimpan (upsert) lalu status menjadi dikirim dalam satu transaksi
        (E4 Operasi 2). Bila body kosong, yang dikirim adalah draf yang sudah tersimpan; 422 bila belum semua kriteria terisi.
        Kirim ganda bersifat idempoten.
      x-peran:
      - dosen
      - mitra
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PenilaianInput'
      responses:
        '200':
          description: Penilaian terkirim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Penilaian'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Tidak401'
        '403':
          $ref: '#/components/responses/Dilarang403'
        '404':
          $ref: '#/components/responses/TidakAda404'
        '409':
          description: NILAI_TERKUNCI atau SEDANG_DIPROSES (kunci baris tidak terlepas dalam 5 detik; boleh dicoba ulang)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/Validasi422'
  /api/v1/hasil:
    get:
      tags:
      - Hasil
      summary: Daftar hasil per kelompok × komponen (status dan penanda kalibrasi)
      x-peran:
      - koordinator
      parameters:
      - name: kode_kelompok
        in: query
        required: false
        schema:
          type: string
      - name: komponen
        in: query
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/Halaman'
      - $ref: '#/components/parameters/PerHalaman'
      responses:
        '200':
          description: Daftar hasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HasilList'
        '401':
          $ref: '#/components/responses/Tidak401'
        '403':
          $ref: '#/components/responses/Dilarang403'
  /api/v1/hasil/{kode_kelompok}/{komponen}:
    parameters:
    - $ref: '#/components/parameters/KodeKelompok'
    - $ref: '#/components/parameters/Komponen'
    get:
      tags:
      - Hasil
      summary: Detail hasil satu kelompok × komponen
      x-peran:
      - koordinator
      responses:
        '200':
          description: Detail hasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HasilDetail'
        '401':
          $ref: '#/components/responses/Tidak401'
        '403':
          $ref: '#/components/responses/Dilarang403'
        '404':
          $ref: '#/components/responses/TidakAda404'
  /api/v1/hasil/{kode_kelompok}/{komponen}/finalisasi:
    parameters:
    - $ref: '#/components/parameters/KodeKelompok'
    - $ref: '#/components/parameters/Komponen'
    post:
      tags:
      - Hasil
      summary: Memfinalisasi komponen (nilai terkunci)
      x-peran:
      - koordinator
      responses:
        '200':
          description: Komponen final
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HasilItem'
        '401':
          $ref: '#/components/responses/Tidak401'
        '403':
          $ref: '#/components/responses/Dilarang403'
        '404':
          $ref: '#/components/responses/TidakAda404'
        '409':
          description: BELUM_LENGKAP, PERLU_KALIBRASI, STATUS_TIDAK_VALID, atau SEDANG_DIPROSES
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/hasil/{kode_kelompok}/{komponen}/buka-kembali:
    parameters:
    - $ref: '#/components/parameters/KodeKelompok'
    - $ref: '#/components/parameters/Komponen'
    post:
      tags:
      - Hasil
      summary: Membuka kembali komponen final dengan alasan wajib
      x-peran:
      - koordinator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BukaKembaliRequest'
      responses:
        '200':
          description: Komponen dibuka kembali
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HasilItem'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Tidak401'
        '403':
          $ref: '#/components/responses/Dilarang403'
        '404':
          $ref: '#/components/responses/TidakAda404'
        '409':
          description: STATUS_TIDAK_VALID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/Validasi422'
  /api/v1/hasil/{kode_kelompok}/{komponen}/rilis:
    parameters:
    - $ref: '#/components/parameters/KodeKelompok'
    - $ref: '#/components/parameters/Komponen'
    post:
      tags:
      - Hasil
      summary: Merilis nilai komponen
      x-peran:
      - koordinator
      responses:
        '200':
          description: Nilai dirilis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HasilItem'
        '401':
          $ref: '#/components/responses/Tidak401'
        '403':
          $ref: '#/components/responses/Dilarang403'
        '404':
          $ref: '#/components/responses/TidakAda404'
        '409':
          description: BELUM_FINAL atau STATUS_TIDAK_VALID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/kelompok/{kode_kelompok}/nilai:
    parameters:
    - $ref: '#/components/parameters/KodeKelompok'
    get:
      tags:
      - Mahasiswa
      summary: Nilai agregat dan catatan kelompok setelah dirilis (tanpa nama penilai)
      description: Mahasiswa hanya untuk kelompoknya sendiri dan hanya setelah dirilis; koordinator boleh melihat.
      x-peran:
      - mahasiswa
      - koordinator
      responses:
        '200':
          description: Nilai kelompok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NilaiKelompok'
        '401':
          $ref: '#/components/responses/Tidak401'
        '403':
          $ref: '#/components/responses/Dilarang403'
        '404':
          $ref: '#/components/responses/TidakAda404'
  /api/v1/rekap:
    get:
      tags:
      - Rekap
      summary: Rekap nilai akhir (tertimbang semua komponen), JSON atau CSV
      x-peran:
      - koordinator
      parameters:
      - name: tingkat
        in: query
        required: false
        schema:
          type: string
          enum:
          - kelompok
          - mahasiswa
      - name: format
        in: query
        required: false
        schema:
          type: string
          enum:
          - json
          - csv
      - $ref: '#/components/parameters/Halaman'
      - $ref: '#/components/parameters/PerHalaman'
      responses:
        '200':
          description: 'Rekap nilai: JSON berpaginasi, atau berkas CSV bila format=csv (Content-Type text/csv; Content-Disposition:
            attachment). Kolom CSV: kode_kelompok, nama_kelompok, [nrp, nama_mahasiswa bila tingkat=mahasiswa], satu kolom
            per komponen, nilai_akhir.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RekapList'
        '401':
          $ref: '#/components/responses/Tidak401'
        '403':
          $ref: '#/components/responses/Dilarang403'
        '409':
          description: BELUM_LENGKAP (belum semua komponen final)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/Validasi422'
  /api/v1/audit:
    get:
      tags:
      - Audit
      summary: Jejak audit per kelompok × komponen
      x-peran:
      - koordinator
      parameters:
      - name: kode_kelompok
        in: query
        required: false
        schema:
          type: string
      - name: komponen
        in: query
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/Halaman'
      - $ref: '#/components/parameters/PerHalaman'
      responses:
        '200':
          description: Daftar jejak audit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditList'
        '401':
          $ref: '#/components/responses/Tidak401'
        '403':
          $ref: '#/components/responses/Dilarang403'
        '422':
          $ref: '#/components/responses/Validasi422'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    KodeKelompok:
      name: kode_kelompok
      in: path
      required: true
      schema:
        type: string
      description: Format CP-<periode>-nn (Kamus Data Bersama)
    Komponen:
      name: komponen
      in: path
      required: true
      description: Kode komponen (komponen.kode)
      schema:
        type: string
    Halaman:
      name: halaman
      in: query
      required: false
      description: Nomor halaman, mulai 1 (Kamus Data Bersama)
      schema:
        type: integer
        minimum: 1
        default: 1
    PerHalaman:
      name: per_halaman
      in: query
      required: false
      description: Jumlah data per halaman (Kamus Data Bersama)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    Tidak401:
      description: 401 TIDAK_TERAUTENTIKASI (token tidak ada, tidak valid, atau kedaluwarsa)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Dilarang403:
      description: 403 DILARANG (peran atau kepemilikan data tidak sesuai)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TidakAda404:
      description: 404 TIDAK_DITEMUKAN
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Validasi422:
      description: 422 VALIDASI_GAGAL (aturan validasi pada E6)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest400:
      description: 400 PERMINTAAN_RUSAK (JSON rusak atau tipe salah)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooMany429:
      description: 429 TERLALU_BANYAK_PERMINTAAN (Kamus Data Bersama; maksimal 5 kegagalan per 15 menit per identitas, E8)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required:
      - error
      description: Format error mengikuti Kamus Data Bersama, bagian 4.
      properties:
        error:
          type: object
          required:
          - kode
          - pesan
          properties:
            kode:
              type: string
              description: Konstanta huruf besar yang stabil, mis. VALIDASI_GAGAL
            pesan:
              type: string
              description: Ringkasan untuk manusia
            detail:
              type: object
              additionalProperties: true
              description: Opsional; mis. pemetaan field ke pesan validasi
    LoginRequest:
      type: object
      required:
      - identitas
      - password
      properties:
        identitas:
          type: string
          maxLength: 64
          description: nrp (10 digit), kode_dosen, kode_mitra (MTR-nnn), atau kode koordinator
        password:
          type: string
          maxLength: 72
          description: Maksimal 72 byte (batas bcrypt)
    KriteriaInput:
      type: object
      required:
      - nama
      - bobot
      - cpmk
      properties:
        nama:
          type: string
        bobot:
          type: integer
          minimum: 1
          maximum: 100
        cpmk:
          type: integer
          minimum: 1
        deskripsi:
          type: string
    RubrikInput:
      type: object
      required:
      - kode
      - nama
      - kriteria
      properties:
        kode:
          type: string
          pattern: ^[a-z0-9-]{3,32}$
          description: Huruf kecil, angka, dan tanda hubung; 3 sampai 32 karakter
        nama:
          type: string
        kriteria:
          type: array
          minItems: 1
          maxItems: 20
          description: Nama kriteria unik; jumlah bobot tepat 100
          items:
            $ref: '#/components/schemas/KriteriaInput'
    KomponenItem:
      type: object
      required:
      - kode
      - nama
      - rubrik_id
      - bobot_komponen
      properties:
        kode:
          type: string
        nama:
          type: string
        rubrik_id:
          type: integer
          format: int64
        bobot_komponen:
          type: integer
          minimum: 1
          maximum: 100
        rubrik_nama:
          type: string
          readOnly: true
    KomponenInput:
      type: object
      description: 'Kode komponen unik; jumlah bobot_komponen tepat 100; rubrik harus ada. Body berbentuk {"komponen": [...]}.'
      required:
      - komponen
      properties:
        komponen:
          type: array
          items:
            $ref: '#/components/schemas/KomponenItem'
    PenugasanInput:
      type: object
      required:
      - penilai
      - kode_kelompok
      - komponen
      properties:
        penilai:
          type: string
          description: kode_dosen atau kode_mitra (MTR-nnn) pengguna berperan dosen atau mitra
        kode_kelompok:
          type: string
          description: Format CP-<periode>-nn (Kamus Data Bersama)
        komponen:
          type: string
          description: Kode komponen
    SkorInput:
      type: object
      required:
      - kriteria_id
      - nilai
      properties:
        kriteria_id:
          type: integer
          format: int64
        nilai:
          type: integer
          minimum: 0
          maximum: 100
    PenilaianInput:
      type: object
      description: Daftar skor berupa array {kriteria_id, nilai}. Saat kirim, semua kriteria rubrik harus terisi dan milik
        rubrik komponen tersebut.
      properties:
        skor:
          type: array
          items:
            $ref: '#/components/schemas/SkorInput'
        catatan:
          type: string
          maxLength: 2000
    BukaKembaliRequest:
      type: object
      required:
      - alasan
      properties:
        alasan:
          type: string
          minLength: 10
          maxLength: 500
          description: Wajib; panjang dihitung setelah trim
    PaginatedList:
      type: object
      required:
      - data
      - halaman
      - per_halaman
      - total
      description: Bentuk umum respons daftar berpaginasi (Kamus Data Bersama). Tiap endpoint memakai varian bertipe (RubrikList,
        TugasList, dan seterusnya).
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: true
        halaman:
          type: integer
        per_halaman:
          type: integer
        total:
          type: integer
    LoginResponse:
      type: object
      required:
      - token
      - peran
      - identitas
      - nama
      - harus_ganti_password
      properties:
        token:
          type: string
          description: 'JWT HS256 (klaim sub, peran, iat, exp; berlaku 60 menit). Dikirim sebagai header Authorization: Bearer
            <token>.'
        peran:
          type: string
          enum:
          - mahasiswa
          - dosen
          - mitra
          - koordinator
        identitas:
          type: string
        nama:
          type: string
        harus_ganti_password:
          type: boolean
          description: >
            Bila true, pengguna wajib mengganti password sebelum menggunakan
            fitur lain. Token yang diterima hanya boleh dipakai untuk memanggil
            POST /api/v1/auth/ganti-password.
        kode_kelompok:
          type: string
          nullable: true
          description: Hanya terisi untuk peran mahasiswa (dicari server dari anggota_kelompok); null untuk peran lain.
        kedaluwarsa:
          type: string
          format: date-time
    GantiPasswordRequest:
      type: object
      required:
      - password_baru
      properties:
        password_baru:
          type: string
          minLength: 8
          maxLength: 72
          description: Password baru, minimal 8 karakter, maksimal 72 byte (batas bcrypt)
    Kriteria:
      type: object
      required:
      - id
      - nama
      - bobot
      - cpmk
      properties:
        id:
          type: integer
          format: int64
        nama:
          type: string
        bobot:
          type: integer
          minimum: 1
          maximum: 100
        cpmk:
          type: integer
          minimum: 1
        deskripsi:
          type: string
    RubrikRingkas:
      type: object
      required:
      - id
      - kode
      - versi
      - nama
      - terkunci
      - dibuat_pada
      properties:
        id:
          type: integer
          format: int64
        kode:
          type: string
        versi:
          type: integer
          minimum: 1
        nama:
          type: string
        terkunci:
          type: boolean
        dibuat_pada:
          type: string
          format: date-time
    Rubrik:
      allOf:
      - $ref: '#/components/schemas/RubrikRingkas'
      - type: object
        required:
        - kriteria
        properties:
          kriteria:
            type: array
            items:
              $ref: '#/components/schemas/Kriteria'
    StatusPenilaian:
      type: string
      enum:
      - belum_dinilai
      - draf
      - dikirim
      description: belum_dinilai = belum ada baris penilaian; draf dan dikirim sesuai tabel penilaian.
    StatusKomponen:
      type: string
      enum:
      - berjalan
      - final
      - dirilis
    Penugasan:
      type: object
      required:
      - id
      - penilai
      - peran_penilai
      - kode_kelompok
      - komponen
      - status_penilaian
      - dibuat_pada
      properties:
        id:
          type: integer
          format: int64
        penilai:
          type: string
        nama_penilai:
          type: string
        peran_penilai:
          type: string
          enum:
          - dosen
          - mitra
        kode_kelompok:
          type: string
        komponen:
          type: string
        status_penilaian:
          $ref: '#/components/schemas/StatusPenilaian'
        dibuat_pada:
          type: string
          format: date-time
    TugasItem:
      type: object
      required:
      - penugasan_id
      - kode_kelompok
      - komponen
      - status_penilaian
      - status_komponen
      properties:
        penugasan_id:
          type: integer
          format: int64
        kode_kelompok:
          type: string
        nama_kelompok:
          type: string
        komponen:
          type: string
        nama_komponen:
          type: string
        status_penilaian:
          $ref: '#/components/schemas/StatusPenilaian'
        status_komponen:
          $ref: '#/components/schemas/StatusKomponen'
    Skor:
      type: object
      required:
      - kriteria_id
      - nilai
      properties:
        kriteria_id:
          type: integer
          format: int64
        nilai:
          type: integer
          minimum: 0
          maximum: 100
    Penilaian:
      type: object
      required:
      - penugasan_id
      - kode_kelompok
      - komponen
      - status
      - status_komponen
      - rubrik
      - skor
      properties:
        penugasan_id:
          type: integer
          format: int64
        kode_kelompok:
          type: string
        komponen:
          type: string
        status:
          $ref: '#/components/schemas/StatusPenilaian'
        status_komponen:
          $ref: '#/components/schemas/StatusKomponen'
        rubrik:
          $ref: '#/components/schemas/Rubrik'
        skor:
          type: array
          items:
            $ref: '#/components/schemas/Skor'
        catatan:
          type: string
        dikirim_pada:
          type: string
          format: date-time
          nullable: true
        diubah_pada:
          type: string
          format: date-time
          nullable: true
    NilaiDesimal:
      type: string
      pattern: ^[0-9]{1,3}\.[0-9]{2}$
      description: Nilai desimal sebagai string dua desimal persis dari server (NUMERIC(5,2), Kamus Data bagian 7). Frontend
        menampilkannya apa adanya, tanpa menghitung ulang dengan float.
    HasilItem:
      type: object
      required:
      - kode_kelompok
      - komponen
      - status
      - perlu_kalibrasi
      properties:
        kode_kelompok:
          type: string
        nama_kelompok:
          type: string
        komponen:
          type: string
        nama_komponen:
          type: string
        status:
          $ref: '#/components/schemas/StatusKomponen'
        nilai_gabungan:
          allOf:
          - $ref: '#/components/schemas/NilaiDesimal'
          nullable: true
        perlu_kalibrasi:
          type: boolean
        jumlah_penugasan:
          type: integer
        jumlah_dikirim:
          type: integer
        diubah_pada:
          type: string
          format: date-time
    HasilDetail:
      allOf:
      - $ref: '#/components/schemas/HasilItem'
      - type: object
        required:
        - kriteria
        - penilai
        properties:
          kriteria:
            type: array
            description: Skor per kriteria dari penilai yang sudah mengirim. selisih = skor tertinggi dikurangi terendah.
            items:
              type: object
              required:
              - kriteria_id
              - nama
              - cpmk
              - bobot
              - skor
              properties:
                kriteria_id:
                  type: integer
                  format: int64
                nama:
                  type: string
                cpmk:
                  type: integer
                bobot:
                  type: integer
                nilai_gabungan:
                  allOf:
                  - $ref: '#/components/schemas/NilaiDesimal'
                  nullable: true
                selisih:
                  type: integer
                perlu_kalibrasi:
                  type: boolean
                skor:
                  type: array
                  items:
                    type: object
                    required:
                    - penilai
                    - peran
                    - nilai
                    properties:
                      penilai:
                        type: string
                      nama_penilai:
                        type: string
                      peran:
                        type: string
                        enum:
                        - dosen
                        - mitra
                      nilai:
                        type: integer
                        minimum: 0
                        maximum: 100
          penilai:
            type: array
            items:
              type: object
              required:
              - penugasan_id
              - penilai
              - peran
              - status_penilaian
              properties:
                penugasan_id:
                  type: integer
                  format: int64
                penilai:
                  type: string
                nama_penilai:
                  type: string
                peran:
                  type: string
                  enum:
                  - dosen
                  - mitra
                status_penilaian:
                  $ref: '#/components/schemas/StatusPenilaian'
                dikirim_pada:
                  type: string
                  format: date-time
                  nullable: true
    NilaiKelompok:
      type: object
      required:
      - kode_kelompok
      - komponen
      description: Hanya komponen berstatus dirilis. Sebelum ada yang dirilis, komponen = [] (UI menampilkan keadaan kosong).
        Tanpa nama penilai dan tanpa skor per penilai.
      properties:
        kode_kelompok:
          type: string
        nama_kelompok:
          type: string
        komponen:
          type: array
          items:
            type: object
            required:
            - kode
            - nama
            - bobot_komponen
            - nilai_gabungan
            - kriteria
            properties:
              kode:
                type: string
              nama:
                type: string
              bobot_komponen:
                type: integer
              nilai_gabungan:
                $ref: '#/components/schemas/NilaiDesimal'
              kriteria:
                type: array
                items:
                  type: object
                  required:
                  - nama
                  - cpmk
                  - bobot
                  - nilai_gabungan
                  properties:
                    nama:
                      type: string
                    cpmk:
                      type: integer
                    bobot:
                      type: integer
                    nilai_gabungan:
                      $ref: '#/components/schemas/NilaiDesimal'
              catatan:
                type: array
                items:
                  type: string
    RekapItem:
      type: object
      required:
      - kode_kelompok
      - komponen
      - nilai_akhir
      properties:
        kode_kelompok:
          type: string
        nama_kelompok:
          type: string
        nrp:
          type: string
          nullable: true
          description: Terisi hanya bila tingkat=mahasiswa.
        nama_mahasiswa:
          type: string
          nullable: true
        komponen:
          type: array
          items:
            type: object
            required:
            - kode
            - nilai_gabungan
            properties:
              kode:
                type: string
              nilai_gabungan:
                $ref: '#/components/schemas/NilaiDesimal'
        nilai_akhir:
          $ref: '#/components/schemas/NilaiDesimal'
    AuditItem:
      type: object
      required:
      - id
      - waktu
      - aktor
      - aksi
      properties:
        id:
          type: integer
          format: int64
        waktu:
          type: string
          format: date-time
        aktor:
          type: string
        aksi:
          type: string
          enum:
          - SKOR_DISIMPAN
          - SKOR_DIKIRIM
          - FINALISASI
          - BUKA_KEMBALI
          - RILIS
          - PENUGASAN_DITAMBAH
          - PENUGASAN_DIHAPUS
        kode_kelompok:
          type: string
          nullable: true
        komponen:
          type: string
          nullable: true
        nilai_lama:
          type: object
          nullable: true
          additionalProperties: true
        nilai_baru:
          type: object
          nullable: true
          additionalProperties: true
        alasan:
          type: string
          nullable: true
    RubrikList:
      type: object
      required:
      - data
      - halaman
      - per_halaman
      - total
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RubrikRingkas'
        halaman:
          type: integer
        per_halaman:
          type: integer
        total:
          type: integer
    KomponenList:
      type: object
      required:
      - data
      - halaman
      - per_halaman
      - total
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/KomponenItem'
        halaman:
          type: integer
        per_halaman:
          type: integer
        total:
          type: integer
    PenugasanList:
      type: object
      required:
      - data
      - halaman
      - per_halaman
      - total
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Penugasan'
        halaman:
          type: integer
        per_halaman:
          type: integer
        total:
          type: integer
    TugasList:
      type: object
      required:
      - data
      - halaman
      - per_halaman
      - total
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TugasItem'
        halaman:
          type: integer
        per_halaman:
          type: integer
        total:
          type: integer
    HasilList:
      type: object
      required:
      - data
      - halaman
      - per_halaman
      - total
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/HasilItem'
        halaman:
          type: integer
        per_halaman:
          type: integer
        total:
          type: integer
    RekapList:
      type: object
      required:
      - data
      - halaman
      - per_halaman
      - total
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RekapItem'
        halaman:
          type: integer
        per_halaman:
          type: integer
        total:
          type: integer
    AuditList:
      type: object
      required:
      - data
      - halaman
      - per_halaman
      - total
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditItem'
        halaman:
          type: integer
        per_halaman:
          type: integer
        total:
          type: integer